* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #f7f4fb;
    background: #08070c;
}

:root {
    --pink: #ff5cad;
    --pink2: #ff8ac8;
    --muted: #aaa3b3;
    --border: rgba(255, 92, 173, 0.28);
}


/* =========================================================
   BACKGROUND
   ========================================================= */

.background {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 0;

    background-image: url("../assets/background.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    transform: scale(1.01);
}

.overlay {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 1;

    background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.10),
        rgba(0, 0, 0, 0.48)
    );

    pointer-events: none;
}


/* =========================================================
   STRUCTURE PRINCIPALE
   ========================================================= */

.shell {
    position: relative;
    z-index: 2;

    width: min(1500px, calc(100vw - 80px));
    height: min(820px, calc(100vh - 60px));

    margin: 30px auto;

    display: grid;
    grid-template-rows: 150px 1fr 50px;
    gap: 16px;

    transform: scale(1.2);
    transform-origin: top center;
}

/* =========================================================
   PANELS
   ========================================================= */

.panel {
    background: linear-gradient(
        145deg,
        rgba(27, 21, 34, 0.92),
        rgba(12, 11, 18, 0.80)
    );

    border: 1px solid var(--border);

    box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.35);

    backdrop-filter: blur(14px);
}

/* =========================================================
   PARTIE SUPÉRIEURE
   ========================================================= */

.top {
    display: grid;
    grid-template-columns: 360px 1fr 360px;
    gap: 25px;
}


/* =========================================================
   JOUEUR
   ========================================================= */

.player-card {
    height: 132px;

    border-radius: 22px;

    padding: 16px;

    display: flex;
    align-items: center;

    gap: 16px;
}

.player-card img {
    width: 94px;
    height: 94px;

    border-radius: 50%;

    object-fit: cover;

    border: 3px solid var(--pink);
}

.player-card h2 {
    margin: 4px 0;

    font-size: 26px;
}

.player-card p {
    margin: 0;

    color: var(--muted);

    font-size: 13px;
}

.eyebrow {
    color: var(--pink2);

    font-weight: 800;
    font-size: 11px;

    letter-spacing: 0.14em;
}


/* =========================================================
   LOGO / TITRE ASTREA
   ========================================================= */

.brand {
    text-align: center;
}

.brand > span {
    color: var(--pink2);

    font-weight: 900;

    letter-spacing: 0.5em;

    margin-left: 0.5em;
}

.brand h1 {
    margin: 0 0 12px;

    font-size: 64px;
    line-height: 1;

    font-weight: 950;

    letter-spacing: 0.04em;
}


/* =========================================================
   CHARGEMENT
   ========================================================= */

.status-row {
    width: min(590px, 90%);

    margin: 0 auto 7px;

    display: flex;
    justify-content: space-between;

    color: var(--muted);

    font-size: 11px;
    font-weight: 800;

    letter-spacing: 0.12em;
}

.status-row b {
    color: var(--pink2);
}

.progress {
    width: min(590px, 90%);
    height: 10px;

    margin: auto;

    background: rgba(255, 255, 255, 0.08);

    border-radius: 999px;

    overflow: hidden;
}

.progress div {
    height: 100%;
    width: 0;

    background: linear-gradient(
        90deg,
        var(--pink),
        var(--pink2)
    );

    box-shadow:
        0 0 20px rgba(255, 92, 173, 0.55);

    transition: width 0.3s;
}

.brand small {
    display: block;

    margin-top: 8px;

    color: #756f7b;

    font-size: 10px;
}


/* =========================================================
   GRILLE DES 4 COMPARTIMENTS
   ========================================================= */

.grid {
    min-height: 0;

    display: grid;

    grid-template-columns:
        1fr
        1.25fr
        1fr
        1.45fr;

    gap: 18px;
}

.block {
    border-radius: 24px;

    padding: 22px;

    overflow: hidden;
}


/* =========================================================
   TITRES DES COMPARTIMENTS
   ========================================================= */

.title {
    height: 54px;

    border-bottom:
        1px solid rgba(255, 92, 173, 0.18);

    margin-bottom: 18px;
}

.title h3 {
    margin: 0;
    color: var(--pink2);
    font-size: 20px;
}

.title span {
    display: block;

    margin-top: 5px;

    color: #777080;

    font-size: 9px;

    letter-spacing: 0.12em;
}


/* =========================================================
   ABOUT US
   ========================================================= */

.link-card {
    text-decoration: none;

    color: inherit;

    min-height: 82px;

    margin-bottom: 14px;

    border-radius: 16px;

    border:
        1px solid rgba(255, 255, 255, 0.06);

    background:
        rgba(255, 255, 255, 0.025);

    padding: 16px;

    display: flex;

    justify-content: space-between;
    align-items: center;
}

.link-card:hover {
    border-color:
        rgba(255, 92, 173, 0.45);

    background:
        rgba(255, 92, 173, 0.07);
}

.link-card b,
.link-card span {
    display: block;
}

.link-card span {
    margin-top: 5px;

    color: var(--muted);

    font-size: 12px;
}

.link-card strong {
    color: var(--pink2);

    font-size: 22px;
}

/* =========================================================
   RÈGLEMENT
   ========================================================= */

.rules {
    display: grid;

    gap: 12px;
}

.rules div {
    display: grid;

    grid-template-columns: 42px 1fr;

    gap: 12px;

    padding: 13px;

    border-radius: 14px;

    background:
        rgba(255, 255, 255, 0.025);

    border:
        1px solid rgba(255, 255, 255, 0.045);
}

.rules b {
    color: var(--pink2);

    font-size: 13px;
}

.rules span {
    font-size: 14px;
    line-height: 1.45;
    color: #d7d1de;
}


/* =========================================================
   STAFF
   ========================================================= */

.staff {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

/* Groupe : Fondatrice, Administrateurs, etc. */
.staff-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

/* Petit titre au-dessus de chaque catégorie */
.staff-group-title {
    padding-left: 4px;
    margin-top: 3px;

    color: var(--pink2);

    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.4px;

    opacity: 0.75;
}

/* Carte d'un membre */
.staff-row {
    display: flex;

    align-items: center;

    gap: 12px;

    padding: 10px;

    border-radius: 15px;

    background:
        rgba(255, 255, 255, 0.025);

    border:
        1px solid rgba(255, 255, 255, 0.045);
}

/* Avatar Steam */
.staff-row img {
    width: 44px;
    height: 44px;

    flex-shrink: 0;

    object-fit: cover;

    border-radius: 50%;

    border:
        1px solid rgba(255, 92, 173, 0.35);
}

.staff-row b,
.staff-row span {
    display: block;
}

.staff-row span {
    color: var(--pink2);

    font-size: 11px;

    margin-top: 3px;
}

/* =========================================================
   INFORMATIONS SERVEUR
   ========================================================= */

.server {
    display: flex;

    flex-direction: column;
}


/* =========================================================
   IMAGE DE LA MAP
   ========================================================= */

.map-preview {
    position: relative;

    height: 380px;
    flex: none;

    border-radius: 18px;
    overflow: hidden;

    background: #111;

    border: 1px solid rgba(255, 255, 255, 0.06);
}

.map-preview > #map-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.fade {
    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            to top,
            rgba(5, 5, 9, 0.92),
            transparent 62%
        );
}

.map-info {
    position: absolute;

    left: 18px;
    right: 18px;
    bottom: 16px;
}

.map-info span {
    display: block;

    color: var(--pink2);

    font-size: 9px;

    font-weight: 800;

    letter-spacing: 0.12em;
}

.map-info b {
    display: block;

    margin-top: 5px;

    font-size: 18px;
}

.map-info .small-icon {
    width: 16px !important;
    height: 16px !important;
    object-fit: contain;
    flex-shrink: 0;
}

/* =========================================================
   NOMBRE DE JOUEURS / MODE
   ========================================================= */

.stats {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-top: 14px;
}

.stats > div {
    border-radius: 14px;
    padding: 12px 14px;

    background:
        rgba(255, 255, 255, 0.025);

    border:
        1px solid rgba(255, 255, 255, 0.045);
}

.stats > div > span {
    display: block;

    color: var(--muted);
    font-size: 9px;
    letter-spacing: 0.1em;
}

.stats b {
    display: block;
    margin-top: 6px;

    font-size: 16px;
    font-weight: 800;
}

.stats b span {
    display: inline;
    color: inherit;
    font-size: inherit;
    letter-spacing: normal;
}

.stat-label {
    display: flex;
    align-items: center;
    gap: 7px;

    padding: 0;
    border: 0;
    background: none;
}


/* =========================================================
   CONSEIL
   ========================================================= */

.tip {
    border-radius: 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 16px;
}

.tip b {
    color: var(--pink2);

    font-size: 16px;
    font-weight: 800;

    letter-spacing: 0.12em;
}

.tip span {
    color: #d7d1de;

    font-size: 17px;
    font-weight: 500;
}

.tip-icon {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    object-fit: contain;
}


/* =========================================================
   PETITES RÉSOLUTIONS
   ========================================================= */

@media (max-width: 1200px) {

    .top {
        grid-template-columns:
            290px 1fr;
    }

    .top > div:last-child {
        display: none;
    }

    .grid {
        grid-template-columns:
            1fr 1fr;

        grid-template-rows:
            1fr 1fr;
    }

    .shell {
        width:
            calc(100vw - 34px);
    }
}

/* =========================================================
   ICONES
   ========================================================= */

.title h3 {
    display: flex;
    align-items: center;
    gap: 10px;
}

.title-icon {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    object-fit: contain;
}

.link-card {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 14px;
}

.card-icon {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    object-fit: contain;
}

.map-label {
    display: flex !important;
    align-items: center;
    gap: 7px;
}

.small-icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    object-fit: contain;
}

.stat-label {
    display: flex;
    align-items: center;
    gap: 7px;
}

.stat-icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    object-fit: contain;
}

.stats .stat-label span {
    display: inline;
}

.stats b span {
    display: inline;
    color: inherit;
    font-size: inherit;
    letter-spacing: normal;
}


.music-card {
    height: 132px;
    border-radius: 22px;

    padding: 16px;

    display: flex;
    align-items: center;

    gap: 16px;
}

.music-cover {
    width: 94px;
    height: 94px;

    flex-shrink: 0;

    object-fit: cover;

    border-radius: 50%;

    border: 3px solid var(--pink);

    box-shadow:
        0 0 22px rgba(255, 92, 173, 0.18);
}

.music-info {
    min-width: 0;
    flex: 1;
}

.music-info h2 {
    margin: 4px 0;

    font-size: 18px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.music-info p {
    margin: 0 0 10px;

    color: var(--muted);

    font-size: 11px;
}

.music-visualizer {
    width: 150px;
    height: 30px;

    display: flex;
    align-items: flex-end;
    gap: 4px;

    margin-top: 8px;
}

.music-visualizer span {
    flex: 1;
    min-width: 4px;
    max-width: 7px;

    height: 4px;

    background: linear-gradient(
        to top,
        #55e7ff 0%,
        #b94cff 55%,
        #ff5cad 100%
    );

    border-radius: 3px 3px 1px 1px;

    transition: height 0.05s linear;
}


/* =========================================================
   ASTREA FAZBEAR HUNT THEME
   Garde l'architecture du loading Deathrun, mais avec une
   ambiance plus sombre / horreur / surveillance.
   ========================================================= */

:root {
    --astrea-bg: #080706;
    --astrea-panel: rgba(18, 14, 12, 0.88);
    --astrea-panel-2: rgba(30, 22, 18, 0.86);
    --astrea-accent: #8b1e1e;
    --astrea-accent-soft: #c95b4d;
    --astrea-text: #f0e6dc;
    --astrea-muted: #9b8c80;
    --astrea-border: rgba(177, 78, 62, 0.35);
}

body {
    background:
        radial-gradient(circle at 50% 20%, rgba(80, 28, 20, 0.16), transparent 38%),
        linear-gradient(180deg, rgba(0,0,0,0.30), rgba(0,0,0,0.78)),
        #080706;
    color: var(--astrea-text);
}

/* Assombrit légèrement le fond existant sans casser sa structure */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.018) 0px,
            rgba(255,255,255,0.018) 1px,
            transparent 2px,
            transparent 4px
        );
    opacity: .5;
    z-index: 9998;
}

/* Grain / parasite discret façon caméra de surveillance */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    opacity: .055;
    background-image:
        radial-gradient(circle at 15% 25%, #fff 0 1px, transparent 1px),
        radial-gradient(circle at 75% 40%, #fff 0 1px, transparent 1px),
        radial-gradient(circle at 40% 80%, #fff 0 1px, transparent 1px);
    background-size: 7px 7px, 11px 11px, 13px 13px;
    animation: astrea-static 0.18s steps(2) infinite;
}

@keyframes astrea-static {
    0%   { transform: translate(0,0); }
    25%  { transform: translate(-1px,1px); }
    50%  { transform: translate(1px,-1px); }
    75%  { transform: translate(1px,1px); }
    100% { transform: translate(0,0); }
}

/* Accent rouge sombre sur les éléments qui utilisaient le rose/violet */
button,
.button,
.btn,
a.button,
.progress-fill,
.progress-bar > div,
.active {
    filter: saturate(.8);
}

/* Effet de respiration très léger sur les titres */
h1, h2, .title, .server-title, .gamemode-title {
    text-shadow:
        0 0 10px rgba(139, 30, 30, .35),
        0 0 24px rgba(80, 18, 18, .15);
}

/* Image de map un peu plus sombre et cinématique */
.map-image,
#map-image,
.map-preview img,
.background-map {
    filter: brightness(.70) contrast(1.12) saturate(.78);
}

/* Petit vignettage horreur */
.vignette,
body .vignette {
    box-shadow: inset 0 0 160px rgba(0,0,0,.72);
}

